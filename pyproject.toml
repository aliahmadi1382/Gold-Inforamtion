[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gold-market-intelligence"
version = "0.8.0"
description = "Provenance-first gold market research and point-in-time analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "tzdata>=2025.1",
]

[project.scripts]
gold = "gold_intelligence.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/gold_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
